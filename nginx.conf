# Public cache in front of martin-orm. Martin renders every tile from PostGIS and sets
# no Cache-Control of its own; this is what keeps pans and zooms off the database.
# Same TTLs as openrailwaymap.app: data changes once a day.
proxy_cache_path /var/cache/nginx/orm
                 levels=1:2
                 keys_zone=orm:50m
                 max_size=10g
                 inactive=7d
                 use_temp_path=off;

server {
  listen 5000;

  # Built from upstream's features/ at image build time (Dockerfile); tile paths in it
  # are relative, Trainlog rewrites them to this host
  location = /style.json {
    root /usr/share/nginx/orm;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
  }

  location / {
    limit_except GET HEAD { deny all; }

    proxy_pass http://martin-orm:3000;
    proxy_http_version 1.1;
    # One cached encoding for everyone: every browser takes gzip
    proxy_set_header Accept-Encoding gzip;

    proxy_cache orm;
    proxy_cache_lock on;
    proxy_cache_lock_age 1m;
    proxy_cache_valid 200 204 404 1d;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_read_timeout 120;

    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "public, max-age=86400, stale-if-error=604800" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Cache-Status $upstream_cache_status always;
  }
}
