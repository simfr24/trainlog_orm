# Self-hosted OpenRailwayMap vector tiles for the map overlay (src/openrailwaymap.py).
#
# openrailwaymap.app rate-limited us, and its usage policy only covers apps usable
# without registration — the overlay is a logged-in feature. So we serve the tiles
# ourselves, without importing any OSM data: upstream's nightly GitHub Actions job
# publishes the fully imported planet database as a public image, and we pull it.
#
#   orm-db      upstream's imported PostGIS database. The data lives inside the image
#               (PGDATA=/data/postgresql, deliberately not a VOLUME), so a refresh is
#               just a pull + recreate. ~2.3 GB compressed.
#   martin-orm  built from upstream's own martin.Dockerfile, so the Martin version and
#               the SQL function sources always match the database we pulled.
#   orm         nginx cache in front, also serving upstream's style.json built from
#               the same commit (Dockerfile). The only container on trainlog_network. The
#               services_proxy nginx reaches it by container name
#               (orm.srv.trainlog.me -> orm:5000); Trainlog points at it with
#               openrailwaymap.tiles_url in config.yaml.
#
# Kept apart from Trainlog's own deploy/martin on purpose: that one is a private,
# single-core style renderer for trip cards, and must stay off the internet.
#
# Refresh nightly with refresh.sh (see there for the cron line).
services:
  orm-db:
    image: ghcr.io/hiddewie/openrailwaymap-import-db:latest
    container_name: orm-db
    restart: unless-stopped
    # The cap includes the page cache: at 3g the database was re-read from disk constantly.
    # Flags override the ALTER SYSTEM tuning upstream's image bakes in (1GB shared_buffers)
    shm_size: 8g
    mem_limit: 32g
    command: ["postgres", "-c", "shared_buffers=8GB", "-c", "effective_cache_size=24GB", "-c", "work_mem=64MB"]
    environment:
      - PGDATA=/data/postgresql
      - POSTGRES_DB=gis
      # Only reachable from the private `orm` network; martin connects as postgres.
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "gis"]
      interval: 10s
      timeout: 5s
      retries: 30
    labels:
      - "traefik.enable=false"
    networks:
      - orm

  # One-shot: swaps in our railway_line_high (sql/) after each database pull. Run by
  # `make up` and refresh.sh, not by `docker compose up`, hence the profile.
  orm-patch:
    image: ghcr.io/hiddewie/openrailwaymap-import-db:latest
    profiles: ["patch"]
    entrypoint: ["psql", "-h", "orm-db", "-U", "postgres", "-d", "gis", "-v", "ON_ERROR_STOP=1",
                 "-f", "/sql/railway_line_high.sql"]
    volumes:
      - ./sql:/sql:ro
    depends_on:
      orm-db:
        condition: service_healthy
    labels:
      - "traefik.enable=false"
    networks:
      - orm

  martin-orm:
    build:
      context: https://github.com/hiddewie/OpenRailwayMap-vector.git
      dockerfile: martin.Dockerfile
    image: trainlog/openrailwaymap-martin:latest
    container_name: martin-orm
    restart: unless-stopped
    # Upstream's config with railway_line_high starting at zoom 5 instead of 7: our function
    # (sql/) adds narrow gauge main lines there, which the low zoom tables leave out
    entrypoint: ["sh", "-c", "sed '/^    railway_line_high:/,/minzoom/ s/minzoom: 7/minzoom: 5/' /config/configuration.yml > /tmp/martin.yml && exec martin --config /tmp/martin.yml --sprite /symbols"]
    depends_on:
      orm-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres@orm-db:5432/gis
      # Required: upstream's config reads ${POSTGRES_RELOAD_INTERVAL:-0s}, and Martin's
      # substitution has no shell-style default, so unset it becomes "-0s" and Martin
      # refuses to start. 10s is what upstream itself runs with.
      - POSTGRES_RELOAD_INTERVAL=10s
    ulimits:
      nproc: 65535
      nofile:
        soft: 26677
        hard: 46677
    mem_limit: 4g
    labels:
      - "traefik.enable=false"
    networks:
      - orm

  orm:
    build:
      context: .
      additional_contexts:
        upstream: https://github.com/hiddewie/OpenRailwayMap-vector.git
    image: trainlog/openrailwaymap-proxy:latest
    container_name: orm
    restart: unless-stopped
    depends_on:
      - martin-orm
    volumes:
      - cache:/var/cache/nginx/orm
    mem_limit: 1g
    networks:
      - orm
      - default

volumes:
  cache:

# default is shared with the services_proxy nginx. The Makefile creates it if missing.
networks:
  orm:
  default:
    name: trainlog_network
    external: true
